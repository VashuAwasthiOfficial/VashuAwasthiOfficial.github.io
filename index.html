<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vashu Awasthi | Founder & Software Architect</title>
    <style>
        :root {
            --bg-base: #060911;
            --card-surface: #0d1321;
            --border-glow: #1f2d4a;
            --accent-orange: #ff6b35;
            --accent-blue: #4dadff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(255, 107, 53, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 10% 60%, rgba(77, 173, 255, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0;
        }

        /* Navigation Header */
        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #8b949e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        /* Hero Wrapper Layout */
        .hero-section {
            max-width: 1100px;
            margin: 60px auto 100px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        @media (max-width: 850px) {
            .hero-section {
                grid-template-columns: 1fr;
                text-align: center;
                margin-top: 20px;
            }
            .profile-card-wrapper {
                order: -1;
            }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        .gradient-title {
            background: linear-gradient(135deg, #fff 30%, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .architecture-tag {
            color: var(--accent-orange);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 16px;
            display: block;
        }

        .hero-desc {
            font-size: 1.2rem;
            color: #c9d1d9;
            margin-bottom: 32px;
        }

        /* Profile Block Styling */
        .profile-card-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .profile-frame {
            background: var(--card-surface);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            text-align: center;
        }

        .avatar-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #161f30;
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .avatar-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-frame h3 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .profile-frame p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        /* Showcase App Section */
        .showcase-container {
            background: #090e1a;
            border-top: 1px solid #141b2b;
            border-bottom: 1px solid #141b2b;
            padding: 90px 20px;
        }

        .section-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-header {
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .accent-bar {
            width: 60px;
            height: 4px;
            background: var(--accent-orange);
            border-radius: 2px;
        }

        .app-grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: center;
        }

        @media (max-width: 850px) {
            .app-grid-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        .app-info-panel h3 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-indicator {
            background: rgba(255, 107, 53, 0.15);
            color: var(--accent-orange);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .app-info-panel p {
            color: #adbac7;
            font-size: 1.05rem;
            margin-bottom: 24px;
        }

        .tech-pill-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .tech-pill {
            background: #141c2e;
            border: 1px solid #222f4d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        /* Integrated UI Flow Gallery */
        .app-gallery-visuals {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .ui-mockup-frame {
            background: var(--card-surface);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            aspect-ratio: 9 / 19;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #384459;
            font-size: 0.8rem;
        }

        .ui-mockup-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Primary Action Framework Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-orange {
            background: var(--accent-orange);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
        }

        .btn-orange:hover {
            background: #ff7c4d;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-glow);
            margin-left: 12px;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.03);
            border-color: var(--text-secondary);
        }

        /* Interactive Footer Contact Matrix */
        .contact-footer-block {
            max-width: 600px;
            margin: 100px auto;
            padding: 0 20px;
            text-align: center;
        }

        .contact-form {
            background: var(--card-surface);
            border: 1px solid var(--border-glow);
            padding: 32px;
            border-radius: 20px;
            margin-top: 30px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-glow);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .footer-credits {
            margin-top: 80px;
            padding: 24px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid #141b2b;
        }
    </style>
</head>
<body>
